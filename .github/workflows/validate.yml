name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  python-tests:
    name: Python compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependency
        run: python -m pip install pytest voluptuous==0.15.2 probatio==0.11.4
      - name: Compile integration
        run: python -m compileall -q custom_components/power_manager
      - name: Check dashboard card JavaScript
        run: |
          node --check custom_components/power_manager/frontend/power-manager-card.js
          node --check custom_components/power_manager/frontend/energiemanager-gsi-panel.js
      - name: Test dashboard card behavior
        run: node --test test_frontend.cjs test_panel.cjs
      - name: Run tests
        run: python -m pytest -q
